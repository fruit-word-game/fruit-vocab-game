<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水果大作战</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; overflow: hidden; 
            background-color: #4a2c11;
            background-size: cover !important; 
            background-position: center center !important; 
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; 
        }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #uiContainer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 10px 20px;
        }

        .top-bar {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
        }
        .badge {
            background: rgba(0, 0, 0, 0.7); color: #fff; padding: 6px 14px;
            border-radius: 20px; font-size: 16px; font-weight: bold; border: 2px solid #ffca28;
        }

        .top-header-area {
            position: absolute; top: 55px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 800px; text-align: center;
        }
        .game-title {
            font-size: 28px; color: #fff; font-weight: 900;
            text-shadow: 2px 2px 0 #000, 0 4px 10px rgba(0,0,0,0.8);
            margin: 0 0 5px 0;
        }
        .question-card {
            background: rgba(255, 248, 225, 0.95);
            border: 3px solid #ffb300; border-radius: 15px;
            padding: 6px 20px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            font-size: 20px; font-weight: bold; color: #5d4037;
        }

        .interactive { pointer-events: auto; }
        .btn {
            background: #ff9800; color: white; border: none; padding: 8px 16px;
            font-size: 14px; font-weight: bold; border-radius: 20px; cursor: pointer;
            box-shadow: 0 3px 0 #e65100; transition: all 0.1s;
        }
        .btn:active { transform: translateY(3px); box-shadow: none; }
        .btn-green { background: #4caf50; box-shadow: 0 3px 0 #1b5e20; }
        .btn-red { background: #f44336; box-shadow: 0 3px 0 #b71c1c; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); z-index: 100; display: flex;
            justify-content: center; align-items: center; pointer-events: auto;
        }
        .modal-body {
            background: #fff8e7; border: 6px solid #8d5524; border-radius: 20px;
            padding: 25px; max-width: 700px; width: 92%; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); text-align: center;
        }
        .modal-title { font-size: 26px; color: #5d4037; margin-bottom: 12px; font-weight: 900; }
        .rule-text { text-align: left; font-size: 15px; color: #4e342e; line-height: 1.6; margin-bottom: 15px; }
        
        .admin-form { text-align: left; margin-top: 10px; }
        .form-group { margin-bottom: 12px; background: #ffe0b2; padding: 10px; border-radius: 8px; }
        .form-group label { font-weight: bold; color: #e65100; display: block; margin-bottom: 3px; font-size: 13px; }
        .form-group input, .form-group textarea { width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; }
        .q-item { border: 2px dashed #ffb300; padding: 8px; margin-bottom: 8px; border-radius: 6px; background: #fff; }
    </style>
</head>
<body>

    <div id="uiContainer">
        <div class="top-bar">
            <div class="badge">⏳ 倒计时: <span id="timerText" style="color:#ffeb3b">60</span>s</div>
            <div class="badge">得分: <span id="scoreText" style="color:#4caf50">0</span> | 进度: <span id="progressText" style="color:#00e676">1/5</span></div>
            <button class="btn interactive" onclick="openAdminModal()">⚙️ 教师配置后台</button>
        </div>

        <div class="top-header-area">
            <h1 class="game-title" id="displayTitle">🍎 过去式切水果大冒险 🍌</h1>
            <div class="question-card" id="questionBox">加载中...</div>
        </div>
    </div>

    <!-- 游戏规则弹窗：默认一打开网页或通过分享网址进入时，首先展示的就是这个界面，绝不卡在后台 -->
    <div id="rulesModal" class="modal-overlay">
        <div class="modal-body">
            <div class="modal-title">🎮 游戏规则</div>
            <div class="rule-text" id="displayRules">
                1. 屏幕正上方会展示当前英语题目。<br>
                2. 巨型 3D 水果会不断向上抛出，请滑动鼠标/手指切碎<b>正确答案</b>的水果！<br>
                3. 全部答完所有题目即可通关并触发欢呼与彩带庆祝！<br>
                4. ⚠️ <b>千万别切到黑色炸弹</b>，否则会扣除大分。<br>
                5. 在规定时间内挑战最高分！
            </div>
            <button class="btn btn-green interactive" style="font-size: 18px; padding: 10px 35px;" onclick="startGame()">开始挑战！</button>
        </div>
    </div>

    <!-- 通关结算弹窗 -->
    <div id="victoryModal" class="modal-overlay" style="display: none;">
        <div class="modal-body" style="border-color: #ffca28; background: #fffde7;">
            <div class="modal-title" style="font-size: 32px; color: #e65100;">🎉 恭喜通关大获全胜！ 🎊</div>
            <div style="font-size: 18px; color: #4e342e; margin: 15px 0; line-height: 1.8;">
                你已经成功切完了题库中的所有题目！<br>
                🏆 <b>最终得分：<span id="finalScoreText" style="color: #4caf50; font-size: 36px;">0</span> 分</b>
            </div>
            <button class="btn btn-green interactive" style="font-size: 18px; padding: 10px 35px;" onclick="restartGame()">再玩一次！</button>
        </div>
    </div>

    <!-- 教师后台修改面板：默认隐藏 -->
    <div id="adminModal" class="modal-overlay" style="display: none;">
        <div class="modal-body">
            <div class="modal-title">🛠️ 教师后台与题库修改面板</div>
            <div class="admin-form">
                <div class="form-group">
                    <label>游戏标题：</label>
                    <input type="text" id="inputTitle">
                </div>
                <div class="form-group">
                    <label>游戏规则说明：</label>
                    <textarea id="inputRules" style="height:50px;"></textarea>
                </div>
                <div class="form-group">
                    <label>游戏时间限制（秒）：</label>
                    <input type="number" id="inputTimeLimit" value="60">
                </div>
                <div class="form-group">
                    <label>📤 上传电脑中的背景图片（已开启强力极限压缩）：</label>
                    <input type="file" id="bgUploader" accept="image/*" onchange="uploadAndCompressBg(event)">
                </div>
                
                <h3 style="color:#5d4037; margin:10px 0 5px 0;">题目管理区：</h3>
                <div id="questionsContainer"></div>
                <button class="btn btn-green interactive" onclick="addNewQuestionField()">+ 添加一道新题目</button>
            </div>
            <div style="margin-top: 15px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
                <button class="btn btn-red interactive" onclick="closeAdminModal()">取消</button>
                <button class="btn interactive" style="background:#009688;" onclick="exportStandaloneHTML()">📥 导出并下载【修改后的水果大作战.html】</button>
                <button class="btn interactive" style="background:#2196f3;" onclick="generateShareLink()">🔗 复制在线分享网址</button>
                <button class="btn btn-green interactive" onclick="saveAdminChanges()">保存并立即生效</button>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        document.title = "水果大作战";

        let gameConfig = {
            title: "🍎 七年级过去式切水果大冒险 🍌",
            rules: "1. 观察上方题目。\n2. 切碎正确的过去式水果。\n3. 全部答完即通关！\n4. 小心炸弹！",
            timeLimit: 60,
            bgImage: "",
            questions: [
                { q: "eat 的过去式是？", correct: "ate", wrongs: ["eated", "eaten"] },
                { q: "go 的过去式是？", correct: "went", wrongs: ["goed", "gone"] },
                { q: "see 的过去式是？", correct: "saw", wrongs: ["seed", "seen"] },
                { q: "buy 的过去式是？", correct: "bought", wrongs: ["buyed", "brought"] },
                { q: "take 的过去式是？", correct: "took", wrongs: ["taked", "taken"] }
            ]
        };

        // 尝试从 URL 加载专属定制配置
        function loadUrlConfig() {
            const urlParams = new URLSearchParams(window.location.search);
            const data = urlParams.get('data');
            if (data) {
                try {
                    const jsonStr = decodeURIComponent(window.atob(data));
                    const loadedConfig = JSON.parse(jsonStr);
                    if (loadedConfig && loadedConfig.questions && loadedConfig.questions.length > 0) {
                        gameConfig = loadedConfig;
                        if (gameConfig.bgImage) {
                            applyBackground(gameConfig.bgImage);
                        }
                    }
                } catch(e) { console.error("配置解析失败", e); }
            }
        }
        loadUrlConfig();

        function applyBackground(url) {
            if (!url) return;
            document.body.style.backgroundImage = `url('${url}')`;
            document.body.style.backgroundSize = "cover";
            document.body.style.backgroundPosition = "center center";
            document.body.style.backgroundRepeat = "no-repeat";
            document.body.style.backgroundAttachment = "fixed";
        }

        function uploadAndCompressBg(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvasImg = document.createElement('canvas');
                    const MAX_WIDTH = 400;
                    const MAX_HEIGHT = 300;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvasImg.width = width;
                    canvasImg.height = height;
                    const ctxImg = canvasImg.getContext('2d');
                    ctxImg.drawImage(img, 0, 0, width, height);

                    const compressedDataUrl = canvasImg.toDataURL('image/jpeg', 0.4);
                    gameConfig.bgImage = compressedDataUrl;
                    applyBackground(compressedDataUrl);
                    alert("✅ 背景图片已完成极限压缩，准备就绪！");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'pop') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'bomb_pop') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(90, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(70, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'correct') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.start(); osc.stop(audioCtx.currentTime + 0.35);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.setValueAtTime(120, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'bomb') {
                osc.type = 'square'; osc.frequency.setValueAtTime(80, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(25, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'victory') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.12);
                    g.gain.setValueAtTime(0.3, audioCtx.currentTime + idx * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.12 + 0.3);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(audioCtx.currentTime + idx * 0.12);
                    o.stop(audioCtx.currentTime + idx * 0.12 + 0.3);
                });
            }
        }

        let bgmTimer = null;
        function startBGM() {
            if (bgmTimer) return;
            const melody = [
                261.63, 329.63, 392.00, 523.25,  440.00, 392.00, 329.63, 293.66,
                349.23, 440.00, 523.25, 659.25,  587.33, 523.25, 440.00, 392.00,
                329.63, 392.00, 440.00, 523.25,  392.00, 329.63, 261.63, 329.63,
                587.33, 659.25, 523.25, 440.00,  392.00, 349.23, 329.63, 261.63
            ];
            let step = 0;
            bgmTimer = setInterval(() => {
                if (audioCtx.state === 'suspended') return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(melody[step % melody.length], audioCtx.currentTime);
                gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
                step++;
            }, 250);
        }

        const fruitEmojis = [
            { emoji: '🍉', juice: '#ff3d00' },
            { emoji: '🥝', juice: '#76ff03' },
            { emoji: '🍇', juice: '#aa00ff' },
            { emoji: '🍋', juice: '#ffd600' },
            { emoji: '🍊', juice: '#ff6d00' },
            { emoji: '🍎', juice: '#d50000' },
            { emoji: '🍓', juice: '#ff1744' },
            { emoji: '🍍', juice: '#ffea00' },
            { emoji: '🥑', juice: '#00e676' },
            { emoji: '🍌', juice: '#ffeb3b' }
        ];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0;
        let currentQIndex = 0;
        let timeLeft = gameConfig.timeLimit;
        let timerInterval = null;
        let fruits = [];
        let particles = [];
        let scoreTexts = [];
        let mouseTrail = [];
        let isGameRunning = false;
        let confetti = [];

        class Confetti {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.size = Math.random() * 10 + 5;
                this.color = ['#ffeb3b', '#ff4081', '#00e676', '#00b0ff', '#ff9800'][Math.floor(Math.random() * 5)];
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = Math.random() * 4 + 3;
                this.rotation = Math.random() * 360;
                this.vRot = (Math.random() - 0.5) * 10;
            }
            update() { this.x += this.vx; this.y += this.vy; this.rotation += this.vRot; }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size/2);
                ctx.restore();
            }
        }

        function triggerVictory() {
            isGameRunning = false;
            clearInterval(timerInterval);
            if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
            playSound('victory');

            confetti = [];
            for(let i=0; i<150; i++) confetti.push(new Confetti());

            document.getElementById('finalScoreText').innerText = score;
            document.getElementById('victoryModal').style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('victoryModal').style.display = 'none';
            confetti = [];
            startGame();
        }

        function updateUI() {
            document.getElementById('displayTitle').innerText = gameConfig.title;
            document.getElementById('displayRules').innerText = gameConfig.rules.replace(/\\n/g, '\n');
            document.getElementById('timerText').innerText = timeLeft;
            if (gameConfig.questions.length > 0) {
                const q = gameConfig.questions[currentQIndex];
                document.getElementById('questionBox').innerText = `第 ${currentQIndex + 1} 题：${q.q}`;
                document.getElementById('progressText').innerText = `${currentQIndex + 1}/${gameConfig.questions.length}`;
            }
        }
        updateUI(); // 初始化加载默认UI文字

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 14; this.vy = (Math.random() - 0.5) * 14;
                this.radius = Math.random() * 8 + 3; this.color = color; this.alpha = 1;
            }
            update() { this.x += this.vx; this.y += this.vy; this.alpha -= 0.03; }
            draw() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color; ctx.fill(); ctx.restore();
            }
        }

        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x; this.y = y; this.text = text; this.color = color;
                this.vy = -2; this.alpha = 1;
            }
            update() { this.y += this.vy; this.alpha -= 0.02; }
            draw() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = '900 32px Arial'; ctx.fillStyle = this.color;
                ctx.textAlign = 'center'; ctx.shadowColor = '#000'; ctx.shadowBlur = 6;
                ctx.fillText(this.text, this.x, this.y); ctx.restore();
            }
        }

        class Fruit {
            constructor() {
                const q = gameConfig.questions[currentQIndex];
                const isBomb = Math.random() < 0.15;

                if (isBomb) {
                    this.isBomb = true;
                    this.word = "💣";
                    playSound('bomb_pop');
                } else {
                    this.isBomb = false;
                    playSound('pop');
                    const isCorrect = Math.random() < 0.5;
                    if (isCorrect) {
                        this.word = q.correct;
                        this.isCorrect = true;
                    } else {
                        this.word = q.wrongs[Math.floor(Math.random() * q.wrongs.length)];
                        this.isCorrect = false;
                    }
                }

                this.radius = 60;
                this.x = Math.random() * (canvas.width - 180) + 90;
                this.y = canvas.height + this.radius;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = -(Math.random() * 3 + 13);
                this.gravity = 0.24;
                this.fruitObj = fruitEmojis[Math.floor(Math.random() * fruitEmojis.length)];
                this.sliced = false;
            }

            update() { this.x += this.vx; this.y += this.vy; this.vy += this.gravity; }

            draw() {
                ctx.save(); ctx.translate(this.x, this.y);
                if (this.isBomb) {
                    ctx.font = '75px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText("💣", 0, 0);
                } else {
                    ctx.font = '85px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 12;
                    ctx.fillText(this.fruitObj.emoji, 0, 0);
                    ctx.shadowBlur = 0;

                    ctx.fillStyle = 'rgba(0,0,0,0.75)';
                    ctx.fillRect(-55, 32, 110, 36);
                    ctx.strokeStyle = '#ffca28'; ctx.lineWidth = 2;
                    ctx.strokeRect(-55, 32, 110, 36);

                    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Arial';
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(this.word, 0, 50);
                }
                ctx.restore();
            }
        }

        function spawnFruit() {
            if (isGameRunning && Math.random() < 0.035 && fruits.length < 4) {
                fruits.push(new Fruit());
            }
        }

        function createJuice(x, y, color) {
            for(let i=0; i<20; i++) particles.push(new Particle(x, y, color));
        }

        function nextQuestion() {
            currentQIndex++;
            if (currentQIndex >= gameConfig.questions.length) {
                triggerVictory();
                return;
            }
            updateUI();
            fruits = [];
        }

        function checkSlice(x, y) {
            if (!isGameRunning) return;
            fruits.forEach((fruit, idx) => {
                if (!fruit.sliced) {
                    const dist = Math.hypot(fruit.x - x, fruit.y - y);
                    if (dist < fruit.radius + 10) {
                        fruit.sliced = true;
                        
                        if (fruit.isBomb) {
                            playSound('bomb');
                            score = Math.max(0, score - 20);
                            scoreTexts.push(new FloatingText(fruit.x, fruit.y, "-20 💣", "#ff1744"));
                            createJuice(fruit.x, fruit.y, '#212121');
                            document.getElementById('scoreText').innerText = score;
                            fruits.splice(idx, 1);
                        } else {
                            createJuice(fruit.x, fruit.y, fruit.fruitObj.juice);
                            if (fruit.isCorrect) {
                                playSound('correct');
                                score += 10;
                                scoreTexts.push(new FloatingText(fruit.x, fruit.y, "+10", "#00e676"));
                                document.getElementById('scoreText').innerText = score;
                                nextQuestion();
                            } else {
                                playSound('wrong');
                                score = Math.max(0, score - 5);
                                scoreTexts.push(new FloatingText(fruit.x, fruit.y, "-5", "#ff1744"));
                                document.getElementById('scoreText').innerText = score;
                                nextQuestion();
                            }
                        }
                    }
                }
            });
        }

        window.addEventListener('mousemove', (e) => {
            mouseTrail.push({ x: e.clientX, y: e.clientY, time: Date.now() });
            checkSlice(e.clientX, e.clientY);
        });
        window.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            mouseTrail.push({ x: t.clientX, y: t.clientY, time: Date.now() });
            checkSlice(t.clientX, t.clientY);
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (confetti.length > 0) {
                confetti.forEach(c => { c.update(); c.draw(); });
            }

            const now = Date.now();
            mouseTrail = mouseTrail.filter(p => now - p.time < 150);
            if (mouseTrail.length > 1) {
                ctx.beginPath(); ctx.moveTo(mouseTrail[0].x, mouseTrail[0].y);
                for (let i = 1; i < mouseTrail.length; i++) ctx.lineTo(mouseTrail[i].x, mouseTrail[i].y);
                ctx.strokeStyle = '#ffca28'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.stroke();
            }

            particles.forEach((p, i) => {
                p.update(); p.draw();
                if (p.alpha <= 0) particles.splice(i, 1);
            });

            scoreTexts.forEach((st, i) => {
                st.update(); st.draw();
                if (st.alpha <= 0) scoreTexts.splice(i, 1);
            });

            spawnFruit();
            fruits.forEach((f, i) => {
                f.update(); f.draw();
                if (f.y > canvas.height + 120) fruits.splice(i, 1);
            });

            requestAnimationFrame(animate);
        }
        animate();

        function startGame() {
            document.getElementById('rulesModal').style.display = 'none';
            document.getElementById('victoryModal').style.display = 'none';
            confetti = [];
            isGameRunning = true;
            timeLeft = gameConfig.timeLimit;
            score = 0;
            currentQIndex = 0;
            document.getElementById('scoreText').innerText = score;
            startBGM();
            updateUI();

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isGameRunning) return;
                timeLeft--;
                document.getElementById('timerText').innerText = timeLeft;
                if (timeLeft <= 0) {
                    isGameRunning = false;
                    clearInterval(timerInterval);
                    if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
                    triggerVictory();
                }
            }, 1000);
        }

        function openAdminModal() {
            isGameRunning = false;
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('adminModal').style.display = 'flex';
            document.getElementById('inputTitle').value = gameConfig.title;
            document.getElementById('inputRules').value = gameConfig.rules;
            document.getElementById('inputTimeLimit').value = gameConfig.timeLimit;
            renderQuestionsForm();
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
            // 关闭后台后返回规则弹窗界面，而不是直接盲目开始运行游戏
            document.getElementById('rulesModal').style.display = 'flex';
        }

        function renderQuestionsForm() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            gameConfig.questions.forEach((q, idx) => {
                const item = document.createElement('div');
                item.className = 'q-item';
                item.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                        <b style="color:#d32f2f">题目 ${idx + 1}</b>
                        <button class="btn btn-red" style="padding:2px 8px; font-size:12px;" onclick="deleteQuestion(${idx})">删除此题</button>
                    </div>
                    <label>问题：</label>
                    <input type="text" value="${q.q}" id="q_title_${idx}">
                    <label style="color:#2e7d32">正确答案：</label>
                    <input type="text" value="${q.correct}" id="q_correct_${idx}">
                    <label style="color:#c62828">错误答案（用英文逗号隔开）：</label>
                    <input type="text" value="${q.wrongs.join(',')}" id="q_wrongs_${idx}">
                `;
                container.appendChild(item);
            });
        }

        function addNewQuestionField() {
            gameConfig.questions.push({ q: "新单词的意思是？", correct: "正确答案", wrongs: ["错误1", "错误2"] });
            renderQuestionsForm();
        }

        function deleteQuestion(idx) {
            gameConfig.questions.splice(idx, 1);
            renderQuestionsForm();
        }

        function collectFormData() {
            gameConfig.title = document.getElementById('inputTitle').value;
            gameConfig.rules = document.getElementById('inputRules').value;
            gameConfig.timeLimit = parseInt(document.getElementById('inputTimeLimit').value) || 60;
            
            gameConfig.questions.forEach((q, idx) => {
                q.q = document.getElementById(`q_title_${idx}`).value;
                q.correct = document.getElementById(`q_correct_${idx}`).value;
                const wrongsStr = document.getElementById(`q_wrongs_${idx}`).value;
                q.wrongs = wrongsStr.split(',').map(s => s.trim()).filter(s => s);
            });
            updateUI();
        }

        function saveAdminChanges() {
            collectFormData();
            closeAdminModal();
            alert("✅ 设置保存成功！请点击规则弹窗的【开始挑战！】按钮开始游戏。");
        }

        function exportStandaloneHTML() {
            collectFormData();
            let currentDoc = document.documentElement.outerHTML;
            const configScript = `gameConfig = ${JSON.stringify(gameConfig)};`;
            currentDoc = currentDoc.replace(/let gameConfig = \{[\s\S]*?\};/, configScript);

            const blob = new Blob([currentDoc], { type: 'text/html;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "水果大作战.html";
            link.click();
            URL.revokeObjectURL(link.href);
            alert("📥 【水果大作战.html】已下载成功！学生双击即可进入规则与开始界面！");
        }

        function generateShareLink() {
            collectFormData();
            
            try {
                const jsonStr = JSON.stringify(gameConfig);
                const encodedData = window.btoa(encodeURIComponent(jsonStr));
                const baseUrl = window.location.href.split('?')[0];
                const shareUrl = `${baseUrl}?data=${encodedData}`;

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(shareUrl).then(() => {
                        alert("🔗 专属游戏分享网址已成功复制到剪贴板！\n\n您可以直接将其粘贴到微信群或QQ群。学生点开后将直接进入该老师专属定制的题目和游戏规则界面，绝不会卡在后台！");
                    }).catch(err => {
                        prompt("请手动复制下方生成的专属游戏网址：", shareUrl);
                    });
                } else {
                    prompt("请手动复制下方生成的专属游戏网址：", shareUrl);
                }
            } catch(e) {
                alert("⚠️ 生成分享网址失败，如果背景图片太大，建议使用【导出并下载网页】按钮发送给学生。");
            }
        }
    </script>
</body>
</html>
