<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>水果大作战 - 欢快吉他版</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; overflow: hidden; 
            background-color: #3e2723;
            background-size: cover !important; 
            background-position: center center !important; 
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; 
        }
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #uiContainer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 10px 20px;
        }

        .top-bar {
            width: 100%; display: flex; justify-content: space-between; align-items: center; pointer-events: auto;
        }
        .badge {
            background: rgba(0, 0, 0, 0.75); color: #fff; padding: 6px 14px;
            border-radius: 20px; font-size: 15px; font-weight: bold; border: 2px solid #ffca28;
        }

        .top-header-area {
            position: absolute; top: 55px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 800px; text-align: center; pointer-events: none;
        }
        .game-title {
            font-size: 26px; color: #fff; font-weight: 900;
            text-shadow: 2px 2px 0 #000, 0 4px 10px rgba(0,0,0,0.8);
            margin: 0 0 5px 0;
        }
        .question-card {
            background: rgba(255, 248, 225, 0.95);
            border: 3px solid #ffb300; border-radius: 15px;
            padding: 6px 20px; box-shadow: 0 6px 15px rgba(0,0,0,0.4);
            font-size: 18px; font-weight: bold; color: #5d4037; pointer-events: auto;
        }

        .interactive { pointer-events: auto; }
        .btn {
            background: #ff9800; color: white; border: none; padding: 8px 16px;
            font-size: 14px; font-weight: bold; border-radius: 20px; cursor: pointer;
            box-shadow: 0 3px 0 #e65100; transition: all 0.1s;
        }
        .btn:active { transform: translateY(3px); box-shadow: none; }
        .btn-green { background: #4caf50; box-shadow: 0 3px 0 #1b5e20; }
        .btn-red { background: #f44336; box-shadow: 0 3px 0 #b71c1c; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); z-index: 100; display: flex;
            justify-content: center; align-items: center; pointer-events: auto;
        }
        .modal-body {
            background: #fff8e7; border: 6px solid #8d5524; border-radius: 20px;
            padding: 20px; max-width: 650px; width: 92%; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); text-align: center;
        }
        .modal-title { font-size: 24px; color: #5d4037; margin-bottom: 10px; font-weight: 900; }
        .rule-text { text-align: left; font-size: 14px; color: #4e342e; line-height: 1.5; margin-bottom: 15px; white-space: pre-wrap; }
        
        .admin-form { text-align: left; margin-top: 10px; }
        .form-group { margin-bottom: 10px; background: #ffe0b2; padding: 8px; border-radius: 8px; }
        .form-group label { font-weight: bold; color: #e65100; display: block; margin-bottom: 3px; font-size: 12px; }
        .form-group input, .form-group textarea { width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; }
        .q-item { border: 2px dashed #ffb300; padding: 8px; margin-bottom: 8px; border-radius: 6px; background: #fff; }
    </style>
</head>
<body>

    <div id="uiContainer">
        <div class="top-bar">
            <div class="badge">⏳ <span id="timerText">60</span>s</div>
            <div class="badge">得分: <span id="scoreText" style="color:#4caf50">0</span> | 进度: <span id="progressText" style="color:#00e676">1/3</span></div>
            <button class="btn interactive" onclick="openAdminModal()">⚙️ 教师后台</button>
        </div>

        <div class="top-header-area">
            <h1 class="game-title" id="displayTitle">🍎 快乐切水果大冒险 🍌</h1>
            <div class="question-card" id="questionBox">加载中...</div>
        </div>
    </div>

    <!-- 游戏规则弹窗 -->
    <div id="rulesModal" class="modal-overlay">
        <div class="modal-body">
            <div class="modal-title">🎵 游戏规则</div>
            <div class="rule-text" id="displayRules">
1. 观察上方正中心展示的题目。
2. 用鼠标或手指滑动切碎正确的答案水果！
3. 小心炸弹，全部切完即可获得胜利！
            </div>
            <button class="btn btn-green interactive" style="font-size: 18px; padding: 10px 30px;" onclick="startGame()">开始快乐挑战！</button>
        </div>
    </div>

    <!-- 通关结算弹窗 -->
    <div id="victoryModal" class="modal-overlay" style="display: none;">
        <div class="modal-body" style="background: #fffde7;">
            <div class="modal-title" style="font-size: 28px; color: #e65100;">🎉 太棒了！挑战成功！ 🎊</div>
            <div style="font-size: 18px; color: #4e342e; margin: 15px 0;">
                🏆 最终得分：<span id="finalScoreText" style="color: #4caf50; font-size: 32px;">0</span> 分
            </div>
            <button class="btn btn-green interactive" style="font-size: 16px; padding: 8px 25px;" onclick="restartGame()">再玩一次</button>
        </div>
    </div>

    <!-- 教师后台面板 -->
    <div id="adminModal" class="modal-overlay" style="display: none;">
        <div class="modal-body">
            <div class="modal-title">🛠️ 教师后台管理</div>
            <div class="admin-form">
                <div class="form-group">
                    <label>房间暗号（修改它可以为不同班级创建独立房间）：</label>
                    <input type="text" id="inputRoomId" value="class1">
                </div>
                <div class="form-group">
                    <label>游戏标题：</label>
                    <input type="text" id="inputTitle">
                </div>
                <div class="form-group">
                    <label>游戏规则说明：</label>
                    <textarea id="inputRules" style="height:50px;"></textarea>
                </div>
                <div class="form-group">
                    <label>游戏时间限制（秒）：</label>
                    <input type="number" id="inputTimeLimit" value="60">
                </div>
                <div class="form-group">
                    <label>📤 上传背景图片（自动压缩，完美铺满不移位）：</label>
                    <input type="file" id="bgUploader" accept="image/*" onchange="uploadAndCompressBg(event)">
                </div>
                
                <h3 style="color:#5d4037; margin:8px 0 4px 0; font-size:14px;">题目管理区：</h3>
                <div id="questionsContainer"></div>
                <button class="btn btn-green interactive" onclick="addNewQuestionField()">+ 添加一道新题目</button>
            </div>
            <div style="margin-top: 15px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;">
                <button class="btn btn-red interactive" onclick="closeAdminModal()">取消</button>
                <button class="btn interactive" style="background:#2196f3;" onclick="generateShortShareLink()">🔗 复制分享网址</button>
                <button class="btn btn-green interactive" onclick="saveAdminChanges()">保存并生效</button>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room') || 'default_room';

        let defaultConfig = {
            title: "🍎 英语过去式切水果大冒险 🍌",
            rules: "1. 观察上方题目。\n2. 切碎正确的过去式水果。\n3. 小心炸弹！",
            timeLimit: 60,
            bgImage: "",
            questions: [
                { q: "eat 的过去式是？", correct: "ate", wrongs: ["eated", "eaten"] },
                { q: "go 的过去式是？", correct: "went", wrongs: ["goed", "gone"] },
                { q: "see 的过去式是？", correct: "saw", wrongs: ["seed", "seen"] }
            ]
        };

        let gameConfig = defaultConfig;
        // 优先从网址 ?data= 参数加载老师分享的题目配置（编码在网址里，任何设备打开都能还原）；
        // 没有 ?data= 时才读本机 localStorage 的房间数据（仅本机有效）
        try {
            const sharedData = urlParams.get('data');
            if (sharedData) {
                const loaded = JSON.parse(decodeURIComponent(window.atob(sharedData)));
                if (loaded && loaded.questions && loaded.questions.length > 0) {
                    gameConfig = loaded;
                }
            } else {
                const savedData = localStorage.getItem('fruit_game_' + roomId);
                if (savedData) {
                    gameConfig = JSON.parse(savedData);
                }
            }
        } catch(e) { console.log(e); }

        function applyBackground(url) {
            if (!url) return;
            document.body.style.backgroundImage = `url('${url}')`;
        }

        if (gameConfig.bgImage) {
            applyBackground(gameConfig.bgImage);
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('adminModal').style.display = 'none';
            document.getElementById('rulesModal').style.display = 'flex';
            updateUI();
        });

        function uploadAndCompressBg(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvasImg = document.createElement('canvas');
                    const MAX_WIDTH = 800; const MAX_HEIGHT = 600;
                    let width = img.width; let height = img.height;
                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }
                    canvasImg.width = width; canvasImg.height = height;
                    const ctxImg = canvasImg.getContext('2d');
                    ctxImg.drawImage(img, 0, 0, width, height);
                    const compressedDataUrl = canvasImg.toDataURL('image/jpeg', 0.5);
                    gameConfig.bgImage = compressedDataUrl;
                    applyBackground(compressedDataUrl);
                    alert("✅ 背景图片已上传并完美自适应铺满！");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // 🍉 水果切开音效：更大声、更有厚重沉稳的打击感
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);

            if (type === 'pop') {
                // 水果出现音效：温和饱满
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(450, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                osc.start(); osc.stop(audioCtx.currentTime + 0.12);
            } else if (type === 'correct') {
                // 正确切碎：大声且沉稳的清脆双音
                osc.type = 'triangle'; 
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.35, audioCtx.currentTime); // 提高音量
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'wrong' || type === 'bomb') {
                // 错误或炸弹：低沉有力、震撼但不刺耳的闷声
                osc.type = 'sawtooth'; 
                osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                osc.start(); osc.stop(audioCtx.currentTime + 0.25);
            } else if (type === 'victory') {
                // 胜利欢呼
                [330, 392, 523, 659].forEach((f, i) => {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(f, audioCtx.currentTime + i*0.12);
                    g.gain.setValueAtTime(0.3, audioCtx.currentTime + i*0.12);
                    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i*0.12 + 0.4);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(audioCtx.currentTime + i*0.12); o.stop(audioCtx.currentTime + i*0.12 + 0.4);
                });
            }
        }

        // 🎸 欢快儿歌风 BGM：吉他/柔和拨弦音色 + 轻打击乐节奏，约60秒（120步）不重复、不尖锐烦躁
        let bgmTimer = null;
        function startBGM() {
            if (bgmTimer) return;
            // 采用明快温馨的儿歌和弦走向（C大调/F大调欢快跳跃音符），使用柔和的 sine/triangle 模拟吉他弹拨与轻巧打击点
            const kidsGuitarMelody = [
                330, 392, 523, 440, 392, 330, 261, 294, 330, 440, 523, 659, 523, 440, 392, 330,
                294, 330, 392, 523, 440, 392, 330, 294, 261, 330, 392, 440, 523, 587, 523, 440,
                392, 440, 523, 659, 784, 659, 523, 440, 392, 330, 294, 330, 440, 523, 440, 392,
                261, 294, 330, 392, 440, 523, 659, 523, 440, 392, 330, 294, 261, 330, 392, 523,
                440, 392, 330, 294, 330, 392, 440, 523, 587, 523, 440, 392, 330, 261, 294, 330,
                392, 440, 523, 659, 587, 523, 440, 392, 330, 294, 261, 330, 392, 440, 523, 587,
                659, 784, 659, 587, 523, 440, 392, 330, 294, 261, 330, 392, 440, 523, 659, 784,
                659, 523, 440, 392, 330, 294, 261, 330, 392, 440, 523, 659, 523, 440, 330, 294
            ]; 
            let step = 0;
            bgmTimer = setInterval(() => {
                if (audioCtx.state === 'suspended') return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                // 使用正弦波与柔和三角波组合，完全模拟吉他/木琴的温暖拨弦感，声音浑厚不刺耳
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(kidsGuitarMelody[step % kidsGuitarMelody.length], audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.025, audioCtx.currentTime); // 音量适中温柔
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                step++;
            }, 500); // 每半秒一步，节奏轻快活泼
        }

        const fruitEmojis = [
            { emoji: '🍉', juice: '#ff3d00' }, { emoji: '🥝', juice: '#76ff03' },
            { emoji: '🍇', juice: '#aa00ff' }, { emoji: '🍋', juice: '#ffd600' },
            { emoji: '🍎', juice: '#d50000' }, { emoji: '🍌', juice: '#ffeb3b' }
        ];

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let score = 0, currentQIndex = 0, timeLeft = gameConfig.timeLimit;
        let timerInterval = null, fruits = [], particles = [], scoreTexts = [], mouseTrail = [];
        let isGameRunning = false, confetti = [];

        class Confetti {
            constructor() {
                this.x = Math.random() * canvas.width; this.y = -20;
                this.size = Math.random() * 8 + 4;
                this.color = ['#ffeb3b', '#ff4081', '#00e676', '#00b0ff'][Math.floor(Math.random()*4)];
                this.vx = (Math.random() - 0.5) * 4; this.vy = Math.random() * 3 + 2;
                this.rotation = Math.random() * 360; this.vRot = (Math.random() - 0.5) * 8;
            }
            update() { this.x += this.vx; this.y += this.vy; this.rotation += this.vRot; }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color; ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size/2);
                ctx.restore();
            }
        }

        function triggerVictory() {
            isGameRunning = false; clearInterval(timerInterval);
            if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
            playSound('victory');
            confetti = []; for(let i=0; i<100; i++) confetti.push(new Confetti());
            document.getElementById('finalScoreText').innerText = score;
            document.getElementById('victoryModal').style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('victoryModal').style.display = 'none';
            confetti = []; startGame();
        }

        function updateUI() {
            document.getElementById('displayTitle').innerText = gameConfig.title;
            document.getElementById('displayRules').innerText = gameConfig.rules;
            document.getElementById('timerText').innerText = timeLeft;
            if (gameConfig.questions.length > 0) {
                const q = gameConfig.questions[currentQIndex];
                document.getElementById('questionBox').innerText = `第 ${currentQIndex + 1} 题：${q.q}`;
                document.getElementById('progressText').innerText = `${currentQIndex + 1}/${gameConfig.questions.length}`;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.vx = (Math.random()-0.5)*12; this.vy = (Math.random()-0.5)*12;
                this.radius = Math.random()*6 + 2; this.color = color; this.alpha = 1;
            }
            update() { this.x += this.vx; this.y += this.vy; this.alpha -= 0.04; }
            draw() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                ctx.fillStyle = this.color; ctx.fill(); ctx.restore();
            }
        }

        class FloatingText {
            constructor(x, y, text, color) {
                this.x = x; this.y = y; this.text = text; this.color = color; this.vy = -2; this.alpha = 1;
            }
            update() { this.y += this.vy; this.alpha -= 0.03; }
            draw() {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = '900 28px Arial'; ctx.fillStyle = this.color; ctx.textAlign = 'center';
                ctx.fillText(this.text, this.x, this.y); ctx.restore();
            }
        }

        class Fruit {
            constructor() {
                const q = gameConfig.questions[currentQIndex];
                const isBomb = Math.random() < 0.15;
                if (isBomb) {
                    this.isBomb = true; this.word = "💣"; playSound('pop');
                } else {
                    this.isBomb = false; playSound('pop');
                    const isCorrect = Math.random() < 0.5;
                    if (isCorrect) { this.word = q.correct; this.isCorrect = true; }
                    else { this.word = q.wrongs[Math.floor(Math.random() * q.wrongs.length)]; this.isCorrect = false; }
                }
                this.radius = 55;
                this.x = Math.random() * (canvas.width - 160) + 80;
                this.y = canvas.height + this.radius;
                this.vx = (Math.random() - 0.5) * 3;
                this.vy = -(Math.random() * 3 + 12);
                this.gravity = 0.25;
                this.fruitObj = fruitEmojis[Math.floor(Math.random() * fruitEmojis.length)];
                this.sliced = false;
            }
            update() { this.x += this.vx; this.y += this.vy; this.vy += this.gravity; }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y);
                if (this.isBomb) {
                    ctx.font = '65px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText("💣", 0, 0);
                } else {
                    ctx.font = '75px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(this.fruitObj.emoji, 0, 0);
                    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(-50, 28, 100, 32);
                    ctx.strokeStyle = '#ffca28'; ctx.lineWidth = 2; ctx.strokeRect(-50, 28, 100, 32);
                    ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(this.word, 0, 44);
                }
                ctx.restore();
            }
        }

        function spawnFruit() {
            if (isGameRunning && Math.random() < 0.035 && fruits.length < 4) fruits.push(new Fruit());
        }

        function checkSlice(x, y) {
            if (!isGameRunning) return;
            fruits.forEach((fruit, idx) => {
                if (!fruit.sliced && Math.hypot(fruit.x - x, fruit.y - y) < fruit.radius + 10) {
                    fruit.sliced = true;
                    if (fruit.isBomb) {
                        playSound('bomb'); score = Math.max(0, score - 15);
                        scoreTexts.push(new FloatingText(fruit.x, fruit.y, "-15 💣", "#ff1744"));
                        fruits.splice(idx, 1);
                    } else {
                        for(let k=0; k<15; k++) particles.push(new Particle(fruit.x, fruit.y, fruit.fruitObj.juice));
                        if (fruit.isCorrect) {
                            playSound('correct'); score += 10;
                            scoreTexts.push(new FloatingText(fruit.x, fruit.y, "+10", "#00e676"));
                            currentQIndex++;
                            if (currentQIndex >= gameConfig.questions.length) triggerVictory();
                            else updateUI();
                        } else {
                            playSound('wrong'); score = Math.max(0, score - 5);
                            scoreTexts.push(new FloatingText(fruit.x, fruit.y, "-5", "#ff1744"));
                            currentQIndex++;
                            if (currentQIndex >= gameConfig.questions.length) triggerVictory();
                            else updateUI();
                        }
                    }
                    document.getElementById('scoreText').innerText = score;
                }
            });
        }

        window.addEventListener('mousemove', (e) => {
            mouseTrail.push({ x: e.clientX, y: e.clientY, time: Date.now() });
            checkSlice(e.clientX, e.clientY);
        });
        window.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            mouseTrail.push({ x: t.clientX, y: t.clientY, time: Date.now() });
            checkSlice(t.clientX, t.clientY);
        });

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (confetti.length > 0) confetti.forEach(c => { c.update(); c.draw(); });

            const now = Date.now();
            mouseTrail = mouseTrail.filter(p => now - p.time < 120);
            if (mouseTrail.length > 1) {
                ctx.beginPath(); ctx.moveTo(mouseTrail[0].x, mouseTrail[0].y);
                for (let i = 1; i < mouseTrail.length; i++) ctx.lineTo(mouseTrail[i].x, mouseTrail[i].y);
                ctx.strokeStyle = '#ffca28'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
            }

            particles.forEach((p, i) => { p.update(); p.draw(); if (p.alpha <= 0) particles.splice(i, 1); });
            scoreTexts.forEach((st, i) => { st.update(); st.draw(); if (st.alpha <= 0) scoreTexts.splice(i, 1); });

            spawnFruit();
            fruits.forEach((f, i) => { f.update(); f.draw(); if (f.y > canvas.height + 100) fruits.splice(i, 1); });

            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        function startGame() {
            document.getElementById('rulesModal').style.display = 'none';
            document.getElementById('victoryModal').style.display = 'none';
            confetti = []; isGameRunning = true;
            timeLeft = gameConfig.timeLimit; score = 0; currentQIndex = 0;
            document.getElementById('scoreText').innerText = score;
            startBGM();
            updateUI();

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!isGameRunning) return;
                timeLeft--; document.getElementById('timerText').innerText = timeLeft;
                if (timeLeft <= 0) { 
                    isGameRunning = false; clearInterval(timerInterval); 
                    if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
                    triggerVictory(); 
                }
            }, 1000);
        }

        function openAdminModal() {
            isGameRunning = false; if (timerInterval) clearInterval(timerInterval);
            document.getElementById('adminModal').style.display = 'flex';
            document.getElementById('inputRoomId').value = roomId;
            document.getElementById('inputTitle').value = gameConfig.title;
            document.getElementById('inputRules').value = gameConfig.rules;
            document.getElementById('inputTimeLimit').value = gameConfig.timeLimit;
            renderQuestionsForm();
        }

        function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; isGameRunning = true; }

        function renderQuestionsForm() {
            const container = document.getElementById('questionsContainer'); container.innerHTML = '';
            gameConfig.questions.forEach((q, idx) => {
                const item = document.createElement('div'); item.className = 'q-item';
                item.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                        <b style="color:#d32f2f">题目 ${idx + 1}</b>
                        <button class="btn btn-red" style="padding:2px 6px; font-size:11px;" onclick="deleteQuestion(${idx})">删除</button>
                    </div>
                    <label>问题：</label><input type="text" value="${q.q}" id="q_title_${idx}">
                    <label style="color:#2e7d32">正确答案：</label><input type="text" value="${q.correct}" id="q_correct_${idx}">
                    <label style="color:#c62828">错误答案（逗号隔开）：</label><input type="text" value="${q.wrongs.join(',')}" id="q_wrongs_${idx}">
                `;
                container.appendChild(item);
            });
        }

        function addNewQuestionField() {
            gameConfig.questions.push({ q: "新题目？", correct: "对", wrongs: ["错1", "错2"] });
            renderQuestionsForm();
        }

        function deleteQuestion(idx) { gameConfig.questions.splice(idx, 1); renderQuestionsForm(); }

        function collectFormData() {
            gameConfig.title = document.getElementById('inputTitle').value;
            gameConfig.rules = document.getElementById('inputRules').value;
            gameConfig.timeLimit = parseInt(document.getElementById('inputTimeLimit').value) || 60;
            gameConfig.questions.forEach((q, idx) => {
                q.q = document.getElementById(`q_title_${idx}`).value;
                q.correct = document.getElementById(`q_correct_${idx}`).value;
                q.wrongs = document.getElementById(`q_wrongs_${idx}`).value.split(',').map(s => s.trim()).filter(s => s);
            });
        }

        function saveAdminChanges() {
            collectFormData();
            const newRoomId = document.getElementById('inputRoomId').value.trim() || 'default_room';
            localStorage.setItem('fruit_game_' + newRoomId, JSON.stringify(gameConfig));
            alert("✅ 保存成功！吉他欢快风道场已更新。");
            closeAdminModal();
            if(newRoomId !== roomId) {
                window.location.href = window.location.pathname + '?room=' + newRoomId;
            } else {
                updateUI(); isGameRunning = true;
            }
        }

        function generateShortShareLink() {
            collectFormData();
            const newRoomId = document.getElementById('inputRoomId').value.trim() || 'default_room';
            localStorage.setItem('fruit_game_' + newRoomId, JSON.stringify(gameConfig));

            // 把完整题目配置编码进网址，学生在任何设备点开都能还原老师出的题
            const base = `${window.location.origin}${window.location.pathname}`;
            let note = "";
            let shareUrl = `${base}?data=${window.btoa(encodeURIComponent(JSON.stringify(gameConfig)))}`;
            if (shareUrl.length > 8000 && gameConfig.bgImage) {
                // 背景图太大时不放进链接，避免微信/QQ截断网址导致打不开
                const slim = Object.assign({}, gameConfig, { bgImage: "" });
                shareUrl = `${base}?data=${window.btoa(encodeURIComponent(JSON.stringify(slim)))}`;
                note = "\n\n⚠️ 背景图片较大，分享链接中不包含背景图（题目和其他设置完全正常）。";
            }

            navigator.clipboard.writeText(shareUrl).then(() => {
                alert(`🔗 分享网址已复制！\n\n粘贴到微信/QQ群，学生在手机、iPad、电脑点开即可直接畅玩你出的题目！${note}`);
            }).catch(() => {
                prompt("请复制以下分享网址：", shareUrl);
            });
        }
    </script>
</body>
</html>
